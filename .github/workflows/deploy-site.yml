name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'content/**'
      - 'market/**'
      - 'scripts/**'
      - 'site/**'
  # harvest 用 GITHUB_TOKEN 提交，不会触发 push 事件；用 workflow_run 在它跑完后部署。
  workflow_run:
    workflows: ['harvest']
    types: [completed]
  workflow_dispatch:

# 排队而不是取消：取消进行中的部署容易留下锁
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build site from committed data
        run: node scripts/build-site.mjs
      - name: Publish site/ to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          # 分支式部署：不走 Actions 产物，避开 "Fetching artifact metadata failed"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Summary
        run: |
          echo "已推送到 gh-pages：$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "提交 ${GITHUB_SHA}"
