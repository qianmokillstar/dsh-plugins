name: deploy-retry

# GitHub 侧偶发故障会让 deploy-pages 取不到产物：
#   "No artifacts named github-pages were found for this workflow run"
# 这个工作流在 deploy-site 失败时自动重跑一次，避免站点连续几天不更新。

on:
  workflow_run:
    workflows: [deploy-site]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed deploy once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "deploy-site 失败（attempt 1），自动重跑：run $RUN_ID"
          gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}"
